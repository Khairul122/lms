name: Build & Release Flutter Siswa APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-siswa:
    name: 📱 Build Siswa Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 1. Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ 2. Setup Java JDK (Java 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 💙 3. Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 4. Install Dependencies
        run: flutter pub get

      - name: 🛠️ 5. Build Release APK
        run: flutter build apk --release

      - name: 🏷️ 6. Prepare APK Artifact
        run: |
          VERSION="${{ github.ref_name }}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ] || [ "$VERSION" = "siswa" ]; then
            VERSION="v1.0.0"
          fi
          mkdir -p bin
          cp build/app/outputs/flutter-apk/app-release.apk bin/lms-siswa-${VERSION}.apk

      - name: 🚀 7. Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: bin/lms-siswa-*.apk
          name: "Release Siswa ${{ github.ref_name }}"
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
