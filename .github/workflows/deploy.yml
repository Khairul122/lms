name: CI/CD Deploy LMS Backend to Rumahweb Hosting

on:
  push:
    branches:
      - main
      - production
      - backend
  workflow_dispatch:

jobs:
  web-deploy:
    name: 🚀 Deploy Backend to Shared Hosting (Rumahweb)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 1. Checkout Repository Code
        uses: actions/checkout@v4

      - name: 🐘 2. Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, bcmath, curl, zip, pdo, pdo_mysql

      - name: 📦 3. Install Composer Dependencies (No-Dev)
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: 🟢 4. Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 🛠️ 5. Build Vite Assets for Production
        run: |
          npm ci
          npm run build

      - name: 🗜️ 6. Compress Vendor Directory to vendor.zip
        run: |
          zip -r vendor.zip vendor/

      - name: 📤 7. Sync Project via FTP to Server (lftp)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -e "
            set ftp:ssl-allow no;
            set ssl:verify-certificate no;
            set ftp:passive-mode true;
            set net:timeout 10;
            set net:max-retries 2;
            open -u ${FTP_USERNAME},'${FTP_PASSWORD}' -p ${FTP_PORT:-21} ${FTP_SERVER};
            mirror -R --verbose \
              --exclude-glob .git/ \
              --exclude-glob .github/ \
              --exclude-glob node_modules/ \
              --exclude-glob tests/ \
              --exclude-glob .env \
              --exclude-glob .env.example \
              --exclude-glob vendor/ \
              --exclude-glob storage/logs/ \
              --exclude-glob README.md \
              --exclude-glob CHANGELOG.md \
              --exclude-glob phpunit.xml \
              ./ public_html/backend_lms/;
            quit;
          "

      - name: ⚡ 8. Execute Auto-Extract Hook on Server
        run: |
          DEPLOY_KEY="${{ secrets.DEPLOY_HOOK_KEY }}"
          if [ -z "$DEPLOY_KEY" ]; then
            DEPLOY_KEY="SYN_DEPLOY_SECRET_KEY_2026"
          fi
          RESPONSE=$(curl -s "https://backend-lms.synectra.xyz/deploy-hook.php?key=${DEPLOY_KEY}")
          echo "Server Hook Response: $RESPONSE"

      - name: 🔔 9. Send Telegram Notification on Status
        if: always()
        run: |
          echo "Deployment process completed with status: ${{ job.status }}"
