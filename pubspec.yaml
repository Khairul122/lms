name: guru
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  intl: ^0.19.0

  url_launcher: ^6.3.0
  http: ^1.2.0
  shared_preferences: ^2.3.2
  file_picker: ^8.1.4
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo_guru.png"
  adaptive_icon_background: "#1A237E"
  adaptive_icon_foreground: "assets/logo_guru.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/
