name: lms
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  shared_preferences: ^2.3.5

  cupertino_icons: ^1.0.8
  pdf: ^3.11.1
  
  # 🔥 Firebase Suite
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.0
  firebase_messaging: ^15.0.0
  firebase_storage: ^12.1.0
  firebase_crashlytics: ^4.0.0
  firebase_analytics: ^11.3.0 # 🔥 Tambah Analytics
  google_sign_in: ^6.2.1
  
  url_launcher: ^6.3.0
  intl: ^0.19.0
  flutter_local_notifications: ^17.2.2
  image_picker: ^1.1.2
  http: ^1.2.1
  googleapis_auth: ^1.6.0
  file_picker: ^8.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo_siswa.png"
  adaptive_icon_background: "#38B0FE"
  adaptive_icon_foreground: "assets/images/logo_siswa.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/kelas.png
